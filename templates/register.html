<!DOCTYPE html>
<html>
<head>

<title>Register - AI Health System</title>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;
align-items:center;
justify-content:center;
font-family:Segoe UI;
overflow:hidden;
}

/* Medical background image */

.bg-image{
position:absolute;
width:100%;
height:100%;
background:url("https://images.unsplash.com/photo-1585435557343-3b092031a831?auto=format&fit=crop&w=1500&q=80");
background-size:cover;
opacity:0.2;
z-index:-1;
}

/* Glass register card */

.register-card{

width:440px;
padding:40px;
border-radius:20px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);

box-shadow:0 10px 40px rgba(0,0,0,0.5);
color:white;
}

/* Animated logo */

.logo{
font-size:45px;
text-align:center;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0px);}
}

.title{
font-size:26px;
font-weight:700;
text-align:center;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:14px;
opacity:0.85;
margin-bottom:25px;
}

.form-control{
border-radius:10px;
border:none;
padding:12px;
}

/* password icon */

.password-box{
position:relative;
}

.toggle-pass{

position:absolute;
right:12px;
top:10px;
cursor:pointer;
font-size:18px;
color:#333;
}

/* Register button */

.register-btn{

width:100%;
padding:12px;
border-radius:12px;
font-weight:600;
background:#00e676;
border:none;
}

.register-btn:hover{
background:#00c853;
}

.login-link{
text-align:center;
margin-top:18px;
}

.login-link a{
color:#00e6e6;
text-decoration:none;
}

</style>

</head>

<body>

<div class="bg-image"></div>

<div class="register-card">

<div class="logo">🧠</div>

<div class="title">
Create Account
</div>

<div class="subtitle">
AI Smart Health Diagnosis System
</div>

{% if error %}
<div class="alert alert-danger text-center">
{{ error }}
</div>
{% endif %}

{% if success %}
<div class="alert alert-success text-center">
{{ success }}
</div>
{% endif %}

<form method="POST" onsubmit="return validateRegister()">

<div class="mb-3">

<input type="text"
name="username"
class="form-control"
placeholder="Username"
required>

</div>

<div class="mb-3 password-box">

<input type="password"
name="password"
id="password"
class="form-control"
placeholder="Password"
required>

<span class="toggle-pass" onclick="togglePassword()">👁</span>

</div>

<div class="mb-3 password-box">

<input type="password"
name="confirm_password"
id="confirm"
class="form-control"
placeholder="Confirm Password"
required>

<span class="toggle-pass" onclick="toggleConfirm()">👁</span>

</div>

<button class="register-btn">
Register
</button>

</form>

<div class="login-link">

Already have an account? <a href="/login">Login</a>

</div>

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

if(pass.type==="password"){
pass.type="text";
}
else{
pass.type="password";
}

}

function toggleConfirm(){

let pass=document.getElementById("confirm");

if(pass.type==="password"){
pass.type="text";
}
else{
pass.type="password";
}

}

</script>

<script>

function validateRegister(){

let username=document.querySelector("input[name='username']").value.trim();
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(username.length < 3){
alert("Username must be at least 3 characters.");
return false;
}

if(password.length < 6){
alert("Password must be at least 6 characters.");
return false;
}

if(password !== confirm){
alert("Passwords do not match.");
return false;
}

return true;

}

</script>

</body>
</html>
