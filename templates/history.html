<!DOCTYPE html>
<html>
<head>

<title>Patient History</title>
<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background-image: url("/static/medical_bg_2.jpg");
background-size: cover;
background-position: center;
background-attachment: fixed;
font-family:'Segoe UI', sans-serif;
}

/* Glass Card */

.table-card{

background: rgba(255,255,255,0.9);
backdrop-filter: blur(10px);

padding:30px;
border-radius:18px;

box-shadow:0 10px 40px rgba(0,0,0,0.25);

}

.container{
max-width:1250px;
margin-top:40px;
}

h2{
text-align:center;
font-weight:700;
margin-bottom:25px;
}

/* Search box */

.search-box{
max-width:300px;
margin-bottom:15px;
}

/* Severity badges */

.sev-low{
background:#28a745;
color:white;
padding:5px 10px;
border-radius:8px;
font-weight:600;
}

.sev-medium{
background:#ffc107;
color:black;
padding:5px 10px;
border-radius:8px;
font-weight:600;
}

.sev-high{
background:#dc3545;
color:white;
padding:5px 10px;
border-radius:8px;
font-weight:600;
}

/* Buttons */

.btn-danger{
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<div class="table-card">

<h2>📂 Your Prediction History</h2>

<div class="d-flex gap-2 mb-3">

<input type="text"
id="searchInput"
class="form-control"
placeholder="🔎 Search patient name, disease, severity...">

<button onclick="searchTable()" class="btn btn-primary">
Search
</button>

<button onclick="clearSearch()" class="btn btn-secondary">
Clear
</button>

<button onclick="exportTableToCSV()"
class="btn btn-success mb-3">
📥 Export CSV
</button>

</div>

<table id="historyTable"
class="table table-striped table-bordered text-center">

<thead class="table-dark">

<tr>

<th>Date</th>
<th>Name</th>
<th>Age</th>
<th>Top BP</th>
<th>Bottom BP</th>
<th>Sugar</th>
<th>BMI</th>
<th>Chest Pain</th>
<th>Disease</th>
<th>Severity</th>
<th>Confidence</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for row in data %}

<tr>

{% for item in row %}
<td>{{ item }}</td>
{% endfor %}

<td>
<a href="/delete/{{ loop.index0 }}"
class="btn btn-danger btn-sm">
🗑 Delete
</a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

<div class="text-center mt-3">

<button onclick="history.back()" class="btn btn-primary btn-lg">
⬅ Back to Dashboard
</button>

</div>

</div>

</div>

<script>

function searchTable(){

let input = document.getElementById("searchInput").value.toLowerCase();

let rows = document.querySelectorAll("#historyTable tbody tr");

rows.forEach(function(row){

let text = row.innerText.toLowerCase();

if(text.includes(input)){
row.style.display="";
}else{
row.style.display="none";
}

});

}

function clearSearch(){

document.getElementById("searchInput").value="";

let rows = document.querySelectorAll("#historyTable tbody tr");

rows.forEach(function(row){

row.style.display="";

});

}

</script>

<script>

function exportTableToCSV(){

let csv = [];

let rows = document.querySelectorAll("#historyTable tr");

rows.forEach(function(row){

let cols = row.querySelectorAll("th, td");

let rowData = [];

cols.forEach(function(col, index){

// skip last column (Delete button)
if(index < cols.length - 1){
rowData.push(col.innerText.trim());
}

});

csv.push(rowData.join(","));

});

let csvFile = new Blob([csv.join("\n")], {type:"text/csv"});

let downloadLink = document.createElement("a");

downloadLink.download = "history.csv";
downloadLink.href = window.URL.createObjectURL(csvFile);

downloadLink.style.display = "none";

document.body.appendChild(downloadLink);

downloadLink.click();

}

</script>
</body>
</html>
