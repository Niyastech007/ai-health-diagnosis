<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>High Risk Cases</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f8fb;
font-family:Segoe UI;
}

.container{
margin-top:40px;
}

.card{
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

</style>

</head>

<body>

<div class="container">

<h2 class="text-center mb-4">
⚠ High Risk Cases
</h2>

<div class="card p-4">

<table class="table table-striped table-bordered text-center">

<tr>

<th>Date</th>
<th>Name</th>
<th>Age</th>
<th>TopBP</th>
<th>BottomBP</th>
<th>Sugar</th>
<th>BMI</th>
<th>Chest</th>
<th>Disease</th>
<th>Severity</th>
<th>Confidence</th>

</tr>

{% for row in data %}

<tr>

{% for item in row %}

<td>{{ item }}</td>

{% endfor %}

</tr>

{% endfor %}

</table>

</div>

<div class="text-center mt-3">

<a href="/admin" class="btn btn-primary">
⬅ Back to Dashboard
</a>

</div>

</div>

</body>
</html>
