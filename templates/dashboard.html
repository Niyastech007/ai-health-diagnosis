<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - AI Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<nav class="navbar navbar-expand-lg navbar-dark bg-black px-4">
    <a class="navbar-brand">AI Health</a>
    <div class="ms-auto">
        <a href="/history" class="btn btn-warning btn-sm">History</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card bg-secondary p-4 rounded-4 shadow-lg">

        <h3 class="mb-4">Welcome, {{ user }}</h3>

        <form method="POST">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <input type="number" name="age" class="form-control" placeholder="Age" required>
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" name="topbp" class="form-control" placeholder="Top BP" required>
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" name="botbp" class="form-control" placeholder="Bottom BP" required>
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" name="sugar" class="form-control" placeholder="Sugar" required>
                </div>
                <div class="col-md-4 mb-3">
                    <input type="number" step="0.1" name="bmi" class="form-control" placeholder="BMI" required>
                </div>
                <div class="col-md-4 mb-3">
                    <select name="chest" class="form-control">
                        <option value="1">Chest Pain - Yes</option>
                        <option value="0">Chest Pain - No</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-danger btn-lg w-100">Predict</button>
        </form>

        {% if prediction %}
        <hr>
        <div class="mt-4">
            <h4>Prediction: <span class="text-warning">{{ prediction }}</span></h4>
            <h5>Confidence: {{ confidence|round(2) }}%</h5>
            <h5>Severity: {{ severity }}</h5>

            <div class="mt-3">
                <a href="/graph" class="btn btn-info">AI Graph</a>
                <a href="/pdf/{{ prediction }}" class="btn btn-success">Download PDF</a>
            </div>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
